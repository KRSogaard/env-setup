# Managed by env-setup (system/sshd-env-setup.conf); re-run an installer after
# editing. Key-only SSH. The 10- prefix makes it win over distro and
# cloud-init drop-ins (sshd keeps the first value it reads for each option).
PasswordAuthentication no
KbdInteractiveAuthentication no
# Root may still log in with a key (some servers are only reachable as root).
PermitRootLogin prohibit-password
