# ─────────────────────────────────────────────────────────────────────────────
# tmux config — dev profiles (work / personal). Deployed by dev/install-{linux,mac}.sh.
# Catppuccin Mocha palette, inlined: no plugin manager needed.
#
# Two substitution mechanisms are in play; mixing them up is what broke this
# config before, so to be explicit:
#   ${VAR}    %hidden config variable, substituted ONCE at parse time.
#             Use it for fixed colours.
#   #{@opt}   tmux user option, resolved at render time, and looked up
#             pane -> window -> session -> global. Use it for anything that
#             differs per session (the profile accent and label).
# A nested conditional such as #[bg=#{?#{==:...},a,b}] is NOT evaluated inside
# a #[...] style spec — the commas and braces break the style parser and tmux
# prints the raw text. Hence the per-session user options below.
# ─────────────────────────────────────────────────────────────────────────────

set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc,xterm*:Tc,alacritty:Tc,wezterm:Tc"

# True colour + styled (squiggly/coloured) underlines, so Claude Code's
# diagnostics underlines survive tmux.
set  -as terminal-features ",*:RGB"
set  -as terminal-features ",*:usstyle"
set  -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set  -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# ── Extended keys: THIS is what makes Shift+Enter reach Claude Code ─────────
# Without it tmux flattens Shift+Enter to a plain Enter and your message sends.
set  -s  extended-keys on
set  -as terminal-features ",*:extkeys"
set  -g  extended-keys-format csi-u
# Let Claude Code's desktop notifications and progress bar reach the outer
# terminal instead of being swallowed by tmux.
set  -g  allow-passthrough on
set  -g  mouse on
set  -g  history-limit 50000
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -s  escape-time 0           # keep at 0: any delay eats Shift+Enter/Alt keys
set  -g  focus-events on
set  -g  set-titles on
# Outer terminal (WezTerm tab/window) title = the dev profile name, so the two
# sessions are distinguishable; other sessions just show their own name.
set  -g  set-titles-string "#{?#{||:#{==:#S,work},#{==:#S,personal}},dev-#S,#S}"
set  -g  display-time 2000
set  -g  status-interval 5

# DEV_PROFILE must NOT be in update-environment: an attaching client without it
# would wipe the per-session value that dev-work / dev-personal set.
set -gu update-environment

# ── Clipboard (pbcopy on macOS, wl-copy on Wayland; OSC 52 over SSH) ────────
set -g set-clipboard on
if-shell 'test "$(uname)" = Darwin' 'set -s copy-command pbcopy' 'set -s copy-command wl-copy'
setw -g mode-keys vi
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode    y send -X copy-pipe-and-cancel

# ── Sane splits & reload ────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; run-shell -b "$HOME/.local/bin/tmux-profile-style" \; display-message "tmux.conf reloaded"
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Bell: the claude-tmux-bell hook rings inactive windows ──────────────────
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# ── Catppuccin Mocha palette (parse-time: ${...}) ───────────────────────────
%hidden MANTLE="#181825"
%hidden CRUST="#11111b"
%hidden SURFACE0="#313244"
%hidden SURFACE1="#45475a"
%hidden TEXT="#cdd6f4"
%hidden SUBTEXT="#a6adc8"
%hidden PEACH="#fab387"
%hidden RED="#f38ba8"

# ── Profile accent/label (render-time: #{@...}, set per session) ─────────────
# Neutral fallbacks for any session that is not work/personal.
set -g @p_accent "#6c7086"
set -g @p_label  "◦ TMUX"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=${MANTLE},fg=${TEXT}"

set -g status-left-length 40
set -g status-left "#[bg=#{@p_accent},fg=${CRUST},bold] #{@p_label} #[bg=${SURFACE0},fg=#{@p_accent},nobold] #S #[bg=${MANTLE},fg=${SURFACE0},nobold] "

set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=${PEACH}]⌨ PREFIX  ,}#[fg=${SUBTEXT},nobold]#h #[bg=${SURFACE0},fg=${SUBTEXT}] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=${SUBTEXT}] #I:#W#{?window_bell_flag,#[fg=${RED}] 🔔,}#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[bg=${SURFACE1},fg=#{@p_accent},bold] #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-bell-style "fg=${RED},bold"

set -g pane-border-style "fg=${SURFACE0}"
set -g pane-active-border-style "fg=#{@p_accent}"
set -g message-style "bg=#{@p_accent},fg=${CRUST},bold"
set -g mode-style "bg=${SURFACE1},fg=${TEXT}"

# ── Per-session profile styling, driven by session NAME ─────────────────────
# Works whether the session came from dev-work/dev-personal or a bare
# `tmux new -s work`, and is re-applied on reload by the `prefix r` binding.
set-hook -g session-created "run-shell -b '$HOME/.local/bin/tmux-profile-style \"#{hook_session_name}\"'"
